<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .dropbtn {
          background-color: orange;
          color: black;
          padding: 16px;
          font-size: 16px;
          border: none;
        }

        .dropbtn:hover {
          background-color: darkorange;
          cursor: pointer;
        }

        .dropdown {
          position: relative;
          display: inline-block;
        }
        
        .expectations-content {
          display: block;
          position: absolute;
          background-color: white;
          max-width: 860px;
          padding: 12px 16px;
          z-index: 1;
        }

        .schedule-content {
          display: none;
          position: absolute;
          background-color: white;
          min-width: 160px;
          padding: 12px 16px;
          z-index: 1;
        }
        
        .show {display:block;}
        .hide {display:none;}
</style>
    <title>Bell Schedule</title>
</head>
<body>

            <button class="dropbtn" onclick="toggleExpectations()">Toggle Expectations/Bell Schedule</button>
    <div class="expectations-content" id="expectations">
      <h3>Most Important Rules</h3>

      <ul>
        <li>Safety first!</li>
          <li>Be a good listener</li>
        <li>Raise your hand before speaking</li>
        <li>Respect the space</li>
          <li>Be kind</li>
      </ul>
      
      
    </div>
  <div class="schedule-content" id="schedule">
                       <img style="display:block; margin-left: auto; margin-right: auto;" src="" height="500" id="scheduleImage">
             </div>


<script type="text/javascript">
  var imlocation = 'images/';
   function ImageArray (n) {
    this.length = n;
     for (var i =1; i <= n; i++) {
       this[i] = ' '
     }
   }
  image = new ImageArray(7);
  image[0] = 'all.png';
  image[1] = 'Monday.png';
  image[2] = 'Tuesday.png';
  image[3] = 'Wednesday.png';
  image[4] = 'Thursday.png';
  image[5] = 'Friday.png';
  image[6] = 'all.png';
  var currentdate = new Date();
  var imagenumber = currentdate.getDay();
  img = document.getElementById("scheduleImage");
  img.src = imlocation+image[imagenumber];

  function toggleExpectations() {
    document.getElementById("expectations").classList.toggle("hide");
    document.getElementById("schedule").classList.toggle("show");
  }

  </script>
</body>
</html>
